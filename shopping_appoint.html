<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laat Saheb</title>
    <link rel="stylesheet" href="web/css/style.css">
    <link rel="stylesheet" href="web/css/style2.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.css"
        integrity="sha512-yHknP1/AwR+yx26cB1y0cjvQUMvEa2PFzt1c9LlS4pRQ5NOTZFWbhBig+X9G9eYW/8m0/4OXNx8pxJ6z57x0dw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick-theme.min.css"
        integrity="sha512-17EgCFERpgZKcm0j0fEq1YCJuyAWdz9KUtv1EjVuaOz8pDnh/0nZxmU6BBXwaaxqoi9PQXnRWqlcDB027hgv9A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" href="web/image/favicon.png">


</head>

<body>

    <div id="header"></div>






    <!-- Wish List start -->

    <section class="vx-contact-section">

        <div class="crv-heading container">
                <span></span>
                <h2>Shopping Appointment</h2>
                <span></span>
            </div>




        <!-- FORM -->
        <div class="vx-contact-form">

            <h3>Book Shubhkalastore Video Shopping Appointment</h3>

            <form>

                <!-- ROW -->
                <div class="vx-row">
                    <div class="vx-input-box">
                        <label>NAME</label>
                        <input type="text" placeholder="Your name">
                    </div>

                    <div class="vx-input-box">
                        <label>EMAIL</label>
                        <input type="email" placeholder="Your email">
                    </div>
                </div>

                <div class="vx-row">
                    <div class="vx-input-box">
                        <label>CONTACT NO.</label>
                        <input type="text" placeholder="Enter Phone no.">
                    </div>
                    <div class="vx-input-box ">
                        <label>Date</label>
                        <input type="datetime-local" placeholder="Enter Date and Time">
                    </div>


                </div>

                <div class="vx-row">

                    <div class="vx-input-box">
                        <label>COUNTRY NAME</label>
                        <input type="text" placeholder="Enter Country">
                    </div>
                </div>
                <!-- MESSAGE -->
                <div class="vx-input-box">
                    <label>MESSAGE</label>
                    <textarea rows="5" placeholder="Write your message..."></textarea>
                </div>

                <!-- BUTTON -->
                <button type="submit" class="vx-btn">SEND</button>

                

            </form>

        </div>

    </section>

    <!-- Wish List end -->



    <div id="footerId"></div>




    <script src="web/js/script.js"></script>

    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.9.0/slick.min.js"
        integrity="sha512-HGOnQO9+SP1V92SrtZfjqxxtLmVzqZpjFFekvzZVWoiASSQgSr4cw9Kqd2+l8Llp4Gm0G8GIFJ4ddwZilcdb8A=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>



</body>

</html>
