<body>
    <div id="header"></div>

    <section class="container-fluid">

        <div class="vx-cart-container container">

            <!-- LEFT: ITEMS -->
            <div class="vx-cart-left">

                <!-- ITEM -->
                <div class="vx-cart-card">
                    <img src="web/image/ctgimg2.webp">

                    <div class="vx-card-info">
                        <h3>WHITE MAHAL JACQUARD DESIGNER KURTA</h3>
                        <p>Size: Unstitched Fabric</p>

                        <div class="vx-card-bottom">
                            <div class="vx-qty">
                                <button>-</button>
                                <span>1</span>
                                <button>+</button>
                            </div>

                            <div class="vx-price">₹1,499</div>
                        </div>

                        <button class="vx-remove">Remove</button>
                    </div>
                </div>
                <div class="vx-cart-card">
                    <img src="web/image/ctgimg2.webp">

                    <div class="vx-card-info">
                        <h3>WHITE MAHAL JACQUARD DESIGNER KURTA</h3>
                        <p>Size: Unstitched Fabric</p>

                        <div class="vx-card-bottom">
                            <div class="vx-qty">
                                <button>-</button>
                                <span>1</span>
                                <button>+</button>
                            </div>

                            <div class="vx-price">₹1,499</div>
                        </div>

                        <button class="vx-remove">Remove</button>
                    </div>
                </div>

                <!-- COPY MORE ITEMS -->

            </div>

            <!-- RIGHT: SUMMARY -->
            <div class="vx-cart-right">

                <h3>Order Summary</h3>

                

                <div class="vx-summary-row">
                    <span>Subtotal</span>
                    <span>₹6,896</span>
                </div>

                <hr>

                <div class="vx-coupon-card">

                    <h3 class="vx-coupon-title">Apply Coupon</h3>

                    <div class="vx-coupon-form">
                        <input type="text" class="vx-coupon-input" placeholder="Enter Coupon Code" id="vxCouponInput">

                        <button type="button" class="vx-coupon-btn" onclick="vxApplyCoupon()">
                            Apply
                        </button>
                    </div>

                    <button type="button" class="vx-coupon-link" onclick="vxShowCoupons()">
                        View Coupons and Gift Cards
                    </button>

                </div>

                <hr>

                <div class="vx-summary-total">
                    <span>Total</span>
                    <span>₹6,896</span>
                </div>
                <hr>
                <div class="vx-summary-row">
                    <span class="shiping-tax">Shipping and taxes calculated at checkout.</span>
                </div>

                <a href="checkout.html"><button class="vx-checkout">Proceed to Checkout</button></a>

            </div>

        </div>

    </section>




    <div id="footerId"></div>
    </div>
